name: Update Org Members

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily
  workflow_dispatch:      # Lets you run it manually anytime

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Org Members and Update README
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os
          import json
          import urllib.request

          url = "https://api.github.com/orgs/BasketBall-Project-2026/members?per_page=100"
          token = os.environ["GH_TOKEN"]
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
              },
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  members = json.loads(resp.read().decode())
          except Exception as e:
              print(f"Error fetching members: {e}")
              members = []

          cells = []
          for m in members:
              user = m["login"]
              cells.append(
                  f'<td align="center">'
                  f'<a href="https://github.com/{user}">'
                  f'<img src="https://github.com/{user}.png?size=100" width="100px"/><br />'
                  f'<sub><b>@{user}</b></sub>'
                  f'</a></td>'
              )

          grid = "<table><tr>" + "".join(cells) + "</tr></table>"

          with open("profile/README.md", "r", encoding="utf-8") as f:
              content = f.read()

          start = "<!-- ORG-MEMBERS:START -->"
          end = "<!-- ORG-MEMBERS:END -->"

          if start in content and end in content:
              before = content.split(start)[0]
              after = content.split(end)[1]
              updated = f"{before}{start}\n{grid}\n{end}{after}"

              with open("profile/README.md", "w", encoding="utf-8") as f:
                  f.write(updated)
          else:
              print("Warning: ORG-MEMBERS comment markers not found in README.md")
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update org members" && git push)
